<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الموظفين — Pipely</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f7f5fb;--card:#fff;--line:#e7e1f2;
    --accent:#7c5cff;--accent-dark:#5f3fe0;
    --amber:#e0932e;--green:#1f9d54;--blue:#2f8fe0;--gray:#8a839c;--danger:#d63d33;
    --text:#241f38;--text-dim:#6b6480;--text-mute:#9992ad;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}

  .topbar{background:linear-gradient(120deg,var(--accent),var(--accent-dark));color:#fff;padding:16px 18px;
    display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
  .logo{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .logo .dot{width:8px;height:8px;background:#fff;border-radius:50%;}
  .top-right{display:flex;align-items:center;gap:10px}
  .refresh-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:12px;font-weight:700;
    padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit}
  .sound-toggle{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;
    border-radius:10px;cursor:pointer;font-size:15px}
  .badge{background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;
    display:none;animation:pulse 1s infinite}
  .badge.show{display:inline-block}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:#fff;border-radius:22px;padding:32px 26px;max-width:340px;width:100%;
    box-shadow:0 20px 50px -20px rgba(124,92,255,.35)}
  .login-logo{text-align:center;font-size:20px;font-weight:800;color:var(--accent-dark);margin-bottom:4px}
  .login-sub{text-align:center;font-size:12px;color:var(--text-mute);margin-bottom:22px}
  .login-card label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin:12px 0 6px}
  .login-card label:first-of-type{margin-top:0}
  .login-card input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:16px;
    font-size:14px;font-family:inherit;background:var(--bg)}
  .login-card input:focus{outline:none;border-color:var(--accent)}
  .pw-field-wrap{position:relative;}
  .pw-field-wrap input{padding-left:44px;}
  .pw-eye{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-mute);
    cursor:pointer;display:flex;align-items:center;}
  .pw-eye:hover{color:var(--accent)}
  .login-btn{width:100%;margin-top:18px;background:linear-gradient(120deg,var(--accent),var(--accent-dark));
    color:#fff;border:none;padding:14px;border-radius:16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
  .login-btn:disabled{opacity:.6}
  .login-msg{margin-top:12px;font-size:12.5px;text-align:center;color:var(--danger);display:none}

  #appContent{display:none}

  .board{display:flex;gap:12px;overflow-x:auto;padding:16px;align-items:flex-start}
  .col{min-width:260px;background:#efeaf7;border-radius:16px;padding:12px;max-height:calc(100vh - 170px);
    display:flex;flex-direction:column}
  .col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
  .col-title{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
  .col-ic{width:15px;height:15px;flex-shrink:0}
  .col-count{background:#fff;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;color:var(--text-dim)}
  .col-body{overflow-y:auto;flex:1}
  .empty-col{text-align:center;font-size:11px;color:var(--text-mute);padding:20px 10px}

  .ocard{background:#fff;border-radius:13px;padding:13px;margin-bottom:10px;box-shadow:0 6px 16px -12px rgba(0,0,0,.2);
    border-inline-start:4px solid var(--gray);cursor:grab;touch-action:none;user-select:none}
  .ocard.dragging{cursor:grabbing;box-shadow:0 20px 40px -14px rgba(36,31,56,.4);transform:rotate(-2deg);opacity:.95}
  .col.drop-target{background:rgba(124,92,255,.15);outline:2px dashed var(--accent)}
  .ocard.c-new{border-inline-start-color:var(--blue)}
  .ocard.c-prep{border-inline-start-color:var(--amber)}
  .ocard.c-ready{border-inline-start-color:var(--accent)}
  .ocard.c-done{border-inline-start-color:var(--green)}
  .ocard.c-problem{border-inline-start-color:var(--danger)}

  .oname{font-size:13px;font-weight:800}
  .ocode{font-size:10px;color:var(--text-mute);margin-top:1px}
  .ophone{font-size:11px;color:var(--text-mute);margin-top:4px}
  .oitems{font-size:10.5px;color:var(--text-dim);margin-top:7px;line-height:1.6;background:var(--bg);
    border-radius:9px;padding:6px 9px}
  .oprice{font-size:12.5px;font-weight:800;color:var(--accent-dark);margin-top:8px}
  .quick-move-row{display:flex;justify-content:space-between;gap:6px;margin-top:9px}
  .quick-move-btn{flex:1;font-size:9px;font-weight:700;padding:6px 4px;border-radius:8px;
    border:1px solid var(--line);background:var(--bg);color:var(--text-dim);cursor:pointer;font-family:inherit}
  .quick-move-btn:hover{background:rgba(124,92,255,.1);color:var(--accent-dark)}

  .inv-wrap{padding:16px;max-width:600px;margin:0 auto}
  .inv-card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;
    box-shadow:0 6px 16px -12px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .inv-info{flex:1}
  .inv-name{font-size:13px;font-weight:800}
  .inv-sku{font-size:10.5px;color:var(--text-mute);margin-top:2px}
  .inv-stock{font-size:16px;font-weight:800;color:var(--accent-dark);margin-top:6px}
  .inv-actions{display:flex;flex-direction:column;gap:6px}
  .inv-btn{font-size:10.5px;font-weight:700;padding:7px 12px;border-radius:10px;border:none;cursor:pointer;font-family:inherit}
  .inv-btn.add{background:rgba(31,157,84,.12);color:var(--green)}
  .inv-btn.set{background:rgba(124,92,255,.12);color:var(--accent-dark)}

  .acc-wrap{padding:20px;max-width:400px;margin:0 auto;text-align:center}

  .inv-header-bar{padding:16px 16px 0;max-width:600px;margin:0 auto}
  .add-product-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;
    border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}

  .cust-wrap{padding:16px;max-width:500px;margin:0 auto}
  .cust-search-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 16px -12px rgba(0,0,0,.15)}
  .cust-search-card label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:6px}
  .cust-search-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;
    font-size:13px;font-family:inherit;margin-bottom:12px}
  .cust-info-card{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 6px 16px -12px rgba(0,0,0,.15)}
  .cust-order-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line);font-size:12.5px}

  .pf-label{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);margin:12px 0 5px}
  .pf-input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;
    font-size:13px;font-family:inherit;background:var(--bg)}
  .pf-images{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .pf-images img{width:60px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
  .pf-upload-btn{margin-top:8px;background:rgba(124,92,255,.1);color:var(--accent-dark);border:none;
    padding:9px 16px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}

  .acc-card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 10px 25px -16px rgba(0,0,0,.15)}
  .acc-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(120deg,var(--accent),var(--accent-dark));
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 14px}
  .acc-name{font-size:16px;font-weight:800}
  .acc-logout{width:100%;margin-top:20px;background:var(--danger);color:#fff;border:none;padding:12px;
    border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .acc-audit-btn{width:100%;margin-top:20px;background:var(--bg);color:var(--accent-dark);border:1.5px solid var(--line);padding:12px;
    border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .analytics-period-tab.on{background:#fff;color:var(--accent);box-shadow:0 2px 6px -3px rgba(0,0,0,.2);}
  .analytics-period-tab{color:var(--text-mute);cursor:pointer;}
  .an-stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
  .an-stat-card{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center;}
  .an-stat-num{font-size:15px;font-weight:800;color:var(--text);}
  .an-stat-lbl{font-size:10px;color:var(--text-mute);margin-top:2px;}
  .an-section-title{font-size:12.5px;font-weight:800;color:var(--text);margin:16px 0 8px;}
  .an-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;}
  .an-row:last-child{border-bottom:none;}
  .an-row-val{font-weight:800;color:var(--accent-dark);}

  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:15;gap:4px;
    box-shadow:0 -8px 20px -14px rgba(0,0,0,.15)}
  .nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:6px 2px 5px;border-radius:14px;cursor:pointer;font-family:inherit;color:var(--text-mute);
    transition:background .15s,color .15s}
  .nav-btn.on{color:var(--accent-dark);background:rgba(124,92,255,.09)}
  .nav-ic{width:23px;height:23px}
  .nav-label{font-size:10px;font-weight:600}
  .nav-btn.on .nav-label{font-weight:800}

  .overlay{display:none;position:fixed;inset:0;background:rgba(36,31,56,.5);z-index:30;align-items:center;
    justify-content:center;padding:16px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:20px;padding:22px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto}
  .modal-close{float:left;background:var(--bg);border:none;width:30px;height:30px;border-radius:9px;font-size:14px;cursor:pointer}
  .print-btn{width:100%;margin-top:10px;background:var(--accent-dark);color:#fff;border:none;padding:12px;
    border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}

  #invoiceTemplate{width:100%;background:#fff;border-radius:16px;
    font-family:'Cairo',Tahoma,sans-serif;direction:rtl}
  .inv-header{position:relative;text-align:center;border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:16px}
  .inv-brand{font-size:18px;font-weight:800;color:var(--accent-dark)}
  .inv-title{font-size:12px;color:var(--text-mute);margin-top:2px}
  .inv-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:14px}
  .inv-block{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:14px;font-size:12px;line-height:1.9}
  .inv-table{width:100%;border-collapse:collapse;font-size:11px}
  .inv-table th{text-align:right;border-bottom:2px solid var(--line);padding:6px 4px;color:var(--text-dim)}
  .inv-table td{border-bottom:1px solid var(--line);padding:8px 4px}
  .inv-total{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;
    border-top:2px solid var(--accent);font-weight:800;font-size:14px}

  /* ===================================================================
     التكيّف مع شاشات الحاسوب — يفعّل تلقائيًا فوق 900px عرض الشاشة
     =================================================================== */
  .desktop-nav{display:none}

  @media (min-width: 900px) {
    body{padding-bottom:0}

    .topbar{padding:16px 32px}
    .desktop-nav{display:flex;gap:6px}
    .desktop-nav-btn{background:none;border:none;color:rgba(255,255,255,.85);font-size:13px;font-weight:700;
      padding:9px 16px;border-radius:20px;cursor:pointer;font-family:inherit}
    .desktop-nav-btn.on{background:rgba(255,255,255,.2);color:#fff}
    .desktop-nav-btn:hover{background:rgba(255,255,255,.12)}

    .bottom-nav{display:none}

    .board{padding:24px 32px;justify-content:flex-start;flex-wrap:nowrap}
    .col{min-width:0;flex:1;max-width:320px;max-height:calc(100vh - 110px)}

    .inv-wrap{max-width:1100px;margin:0 auto;padding:24px 32px;display:grid;
      grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:14px}
    .inv-card{margin-bottom:0}

    .acc-wrap{padding-top:60px}

    .modal{max-width:460px}
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="vertical-align:-4px;margin-left:4px;"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c0-3.9 3.4-7 7.5-7s7.5 3.1 7.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Pipely — دخول الموظفين</div>
    <div class="login-sub">لكل موظف حسابه الخاص</div>
    <label for="staffUsername">اسم المستخدم</label>
    <input type="text" id="staffUsername" autocomplete="username" placeholder="اسم المستخدم">
    <label for="staffPassword">كلمة المرور</label>
    <div class="pw-field-wrap">
      <input type="password" id="staffPassword" autocomplete="current-password" placeholder="كلمة المرور">
      <span class="pw-eye" onclick="togglePasswordVisibility('staffPassword', this)"><svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg></span>
    </div>
    <button class="login-btn" id="staffLoginBtn" onclick="staffLogin()">تسجيل الدخول</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<div id="appContent">
  <div class="topbar">
    <div class="logo"><span class="dot"></span> لوحة الموظفين</div>
    <nav class="desktop-nav">
      <button class="desktop-nav-btn on" id="dnavKanban" onclick="switchStaffTab('kanban')">حالة الزبائن</button>
      <button class="desktop-nav-btn" id="dnavInventory" onclick="switchStaffTab('inventory')">المخزون</button>
      <button class="desktop-nav-btn" id="dnavCustomers" onclick="switchStaffTab('customers')">الزبائن</button>
      <button class="desktop-nav-btn" id="dnavAccount" onclick="switchStaffTab('account')">حسابي</button>
    </nav>
    <div class="top-right">
      <span class="badge" id="badge">0</span>
      <button class="sound-toggle" id="soundBtn" onclick="toggleSound()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" id="soundIcon"><path d="M4 10v4h3.5l4 3.5v-11l-4 3.5H4z" fill="currentColor"/><path d="M16 9a4.5 4.5 0 010 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" id="soundWave1"/><path d="M18.5 6.5a8 8 0 010 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" id="soundWave2" style="display:none;"/><line x1="15" y1="9" x2="20" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" id="soundMuteLine"/><line x1="20" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" id="soundMuteLine2"/></svg></button>
      <button class="refresh-btn" onclick="loadOrders()">تحديث</button>
    </div>
  </div>

  <div class="tab-view" id="kanbanView">
    <div class="board" id="board"></div>
  </div>

  <div class="tab-view" id="inventoryView" style="display:none;">
    <div class="inv-header-bar">
      <button class="add-product-btn" onclick="openProductForm(null)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px;margin-left:5px;"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>أضف منتج جديد</button>
    </div>
    <div class="inv-wrap" id="invWrap"></div>
  </div>

  <div class="tab-view" id="customersView" style="display:none;">
    <div class="cust-wrap">
      <div class="cust-search-card">
        <label for="custSearchInput">رقم هاتف الزبون أو رقم الزبون (مثال: C-0001)</label>
        <input type="text" id="custSearchInput" placeholder="07xxxxxxxxx أو C-0001">
        <button class="submit-btn" onclick="searchCustomer()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px;margin-left:6px;"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>بحث</button>
      </div>
      <div id="custResult"></div>
    </div>
  </div>

  <div class="tab-view" id="accountView" style="display:none;">
    <div class="acc-wrap">
      <div class="acc-card">
        <div class="acc-avatar" id="accAvatar"></div>
        <div class="acc-name" id="accName"></div>
        <button class="acc-audit-btn" onclick="openAnalytics()">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18" style="vertical-align:-4px;"><path d="M5 20V10M12 20V4M19 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          التحليلات والتقارير
        </button>
        <button class="acc-audit-btn" onclick="openAuditLog()">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18" style="vertical-align:-4px;"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          سجل النشاطات
        </button>
        <button class="acc-logout" onclick="staffLogout()">تسجيل الخروج</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="auditLogOverlay" style="display:none;" onclick="if(event.target===this)closeAuditLog()">
    <div class="modal">
      <button class="modal-close" onclick="closeAuditLog()"><svg viewBox="0 0 24 24" fill="none" width="14" height="14" style="vertical-align:-2px;display:inline-block;"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div style="clear:both;"></div>
      <div style="font-size:16px;font-weight:800;margin-bottom:12px;">سجل النشاطات</div>
      <div id="auditLogList"></div>
    </div>
  </div>

  <div class="overlay" id="analyticsOverlay" style="display:none;" onclick="if(event.target===this)closeAnalytics()">
    <div class="modal" style="max-width:480px;">
      <button class="modal-close" onclick="closeAnalytics()"><svg viewBox="0 0 24 24" fill="none" width="14" height="14" style="vertical-align:-2px;display:inline-block;"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div style="clear:both;"></div>
      <div style="font-size:16px;font-weight:800;margin-bottom:12px;">التحليلات والتقارير</div>
      <div style="display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:14px;">
        <button type="button" class="analytics-period-tab on" id="apTabToday" onclick="switchAnalyticsPeriod('today')" style="flex:1;padding:8px;border:none;border-radius:9px;font-size:12px;font-weight:700;background:none;font-family:inherit;">اليوم</button>
        <button type="button" class="analytics-period-tab" id="apTabWeek" onclick="switchAnalyticsPeriod('week')" style="flex:1;padding:8px;border:none;border-radius:9px;font-size:12px;font-weight:700;background:none;font-family:inherit;">آخر أسبوع</button>
        <button type="button" class="analytics-period-tab" id="apTabMonth" onclick="switchAnalyticsPeriod('month')" style="flex:1;padding:8px;border:none;border-radius:9px;font-size:12px;font-weight:700;background:none;font-family:inherit;">آخر شهر</button>
      </div>
      <div id="analyticsResult"></div>
    </div>
  </div>

  <div class="bottom-nav">

<audio id="alertSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAgD4AAIA+AAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
  const API_URL = 'https://api.awnnak.com';
  const STAFF_SESSION_KEY = 'pipely_staff_session';
  const ICONS = {
    new: '<svg class="col-ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    prep: '<svg class="col-ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    ready: '<svg class="col-ic" viewBox="0 0 24 24" fill="none"><path d="M3.5 8L12 4l8.5 4-8.5 4-8.5-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3.5 8v8l8.5 4 8.5-4V8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    done: '<svg class="col-ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    problem: '<svg class="col-ic" viewBox="0 0 24 24" fill="none"><path d="M12 3.5L21.5 20h-19L12 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.5v4.5M12 16.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  };
  const COLUMNS = [
    { key: '🆕 طلب جديد', label: 'طلب جديد', cls: 'c-new', ic: ICONS.new },
    { key: '⚙️ جاري التجهيز', label: 'جاري التجهيز', cls: 'c-prep', ic: ICONS.prep },
    { key: '📦 جاهز للتسليم', label: 'جاهز للتسليم', cls: 'c-ready', ic: ICONS.ready },
    { key: '✅ تم الاستلام والدفع', label: 'تم الاستلام والدفع', cls: 'c-done', ic: ICONS.done },
    { key: '🚫 مشكلة بالطلب', label: 'مشكلة بالطلب', cls: 'c-problem', ic: ICONS.problem },
  ];

  let orders = [];
  let soundOn = false;
  let lastNewCount = 0;

  // أي نص يجي من الزبون (اسم، عنوان، ملاحظات...) لازم يمرّ من هذي الدالة
  // قبل ما يدخل الصفحة — يمنع حقن أكواد ضارة بمتصفح الموظف.
  function escapeHtml_(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getStaffSession() {
    try { return JSON.parse(localStorage.getItem(STAFF_SESSION_KEY) || 'null'); } catch (e) { return null; }
  }

  function authHeaders() {
    const s = getStaffSession();
    if (!s) return {};
    return { 'X-Staff-Token': s.token || '' };
  }

  function togglePasswordVisibility(inputId, iconEl) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    iconEl.innerHTML = isHidden
      ? '<svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg>';
  }

  function staffLogin() {
    const username = document.getElementById('staffUsername').value.trim();
    const password = document.getElementById('staffPassword').value.trim();
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('staffLoginBtn');

    if (!username || !password) {
      msg.textContent = 'الرجاء إدخال اسم المستخدم وكلمة المرور';
      msg.style.display = 'block';
      return;
    }
    btn.disabled = true; btn.textContent = 'جارٍ التحقق...';

    fetch(API_URL + '/staff-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password }),
    })
      .then(function (res) {
        if (res.status === 429) {
          // Cloudflare نفسه حظرنا (محاولات كثيرة متتالية) — يرجّع صفحة
          // خطأ جاهزة منه، مو رد JSON، فنعالجها هنا بوضوح قبل محاولة القراءة
          throw new Error('RATE_LIMITED');
        }
        return res.json();
      })
      .then(function (data) {
        btn.disabled = false; btn.textContent = 'تسجيل الدخول';
        if (data.result === 'success') {
          // نحفظ توكن الجلسة بس — كلمة المرور نفسها ما تبقى محفوظة بالجهاز
          // (نفس مبدأ الجلسات المؤقتة اللي تستخدمه أنظمة زي Salesforce/Odoo).
          try { localStorage.setItem(STAFF_SESSION_KEY, JSON.stringify({ username: username, token: data.token, staffName: data.staffName })); } catch (e) {}
          enterApp();
        } else {
          msg.textContent = data.error || 'بيانات الدخول غير صحيحة';
          msg.style.display = 'block';
        }
      })
      .catch(function (err) {
        if (err && err.message === 'RATE_LIMITED') {
          startLoginRateLimitCountdown_(msg, btn, 'staffLoginBtn');
        } else {
          btn.disabled = false; btn.textContent = 'تسجيل الدخول';
          msg.textContent = 'تعذر الاتصال بالخادم';
          msg.style.display = 'block';
        }
      });
  }

  // عداد تنازلي 60 ثانية لما يصير حظر مؤقت — يعطّل زر الدخول طول المدة
  // ويوضّح للمستخدم بالضبط شكد باقي، بدل رسالة غامضة "حاول لاحقًا".
  function startLoginRateLimitCountdown_(msgEl, btnEl, btnDefaultText) {
    let secondsLeft = 60;
    btnEl.disabled = true;
    function render() {
      msgEl.textContent = 'توقّف مؤقت للأمان — بس ' + secondsLeft + ' ثانية وترجع تحاول. لو نسيت كلمة المرور، تواصل مع الإدارة.';
      msgEl.style.display = 'block';
      btnEl.textContent = 'انتظر (' + secondsLeft + ')';
    }
    render();
    const interval = setInterval(function () {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearInterval(interval);
        msgEl.style.display = 'none';
        btnEl.disabled = false;
        btnEl.textContent = 'تسجيل الدخول';
        return;
      }
      render();
    }, 1000);
  }

  function staffLogout() {
    try { localStorage.removeItem(STAFF_SESSION_KEY); } catch (e) {}
    document.getElementById('appContent').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }

  function enterApp() {
    const session = getStaffSession();
    if (!session) return;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    document.getElementById('accName').textContent = session.staffName;
    document.getElementById('accAvatar').textContent = (session.staffName || '?').charAt(0);
    loadOrders();
    setInterval(loadOrders, 15000);
  }

  function switchStaffTab(tab) {
    ['kanban', 'inventory', 'customers', 'account'].forEach(function (t) {
      document.getElementById(t + 'View').style.display = (t === tab) ? 'block' : 'none';
    });
    document.getElementById('navKanban').classList.toggle('on', tab === 'kanban');
    document.getElementById('navInventory').classList.toggle('on', tab === 'inventory');
    document.getElementById('navCustomers').classList.toggle('on', tab === 'customers');
    document.getElementById('navAccount2').classList.toggle('on', tab === 'account');
    document.getElementById('dnavKanban').classList.toggle('on', tab === 'kanban');
    document.getElementById('dnavInventory').classList.toggle('on', tab === 'inventory');
    document.getElementById('dnavCustomers').classList.toggle('on', tab === 'customers');
    document.getElementById('dnavAccount').classList.toggle('on', tab === 'account');
    if (tab === 'inventory') loadInventory();
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('soundWave2').style.display = soundOn ? 'block' : 'none';
    document.getElementById('soundMuteLine').style.display = soundOn ? 'none' : 'block';
    document.getElementById('soundMuteLine2').style.display = soundOn ? 'none' : 'block';
    if (soundOn) {
      const a = document.getElementById('alertSound');
      a.play().then(function () { a.pause(); a.currentTime = 0; }).catch(function () {});
    }
  }
  function playAlert() {
    if (!soundOn) return;
    const a = document.getElementById('alertSound');
    a.currentTime = 0;
    a.play().catch(function () {});
  }

  function loadOrders() {
    fetch(API_URL + '/all-orders', { headers: authHeaders() })
      .then(function (res) {
        if (res.status === 401) { staffLogout(); throw new Error('session-expired'); }
        return res.json();
      })
      .then(function (data) {
        if (data.result !== 'success') return;
        const newOrders = data.orders || [];
        const newCount = newOrders.filter(function (o) { return o.status === '🆕 طلب جديد'; }).length;
        if (newCount > lastNewCount) playAlert();
        lastNewCount = newCount;

        const badge = document.getElementById('badge');
        if (newCount > 0) { badge.textContent = newCount; badge.classList.add('show'); }
        else { badge.classList.remove('show'); }

        orders = newOrders;
        renderBoard();
      })
      .catch(function () {});
  }

  function renderBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    COLUMNS.forEach(function (col) {
      const colOrders = orders.filter(function (o) { return o.status === col.key; });
      const colEl = document.createElement('div');
      colEl.className = 'col';
      colEl.setAttribute('data-status-key', col.key);
      colEl.innerHTML =
        '<div class="col-head"><span class="col-title">' + col.ic + col.label + '</span><span class="col-count">' + colOrders.length + '</span></div>' +
        '<div class="col-body" id="colBody_' + col.cls + '"></div>';
      board.appendChild(colEl);

      const body = colEl.querySelector('.col-body');
      if (colOrders.length === 0) {
        body.innerHTML = '<div class="empty-col">ماكو طلبات هنا</div>';
        return;
      }
      colOrders.forEach(function (o) {
        const card = document.createElement('div');
        card.className = 'ocard ' + col.cls;
        card.setAttribute('data-order-id', o.id);
        card.onclick = function () { if (!justDragged) openDetail(o.id); };
        const itemsText = (o.items || []).map(function (i) { return escapeHtml_(i.productName) + ' ×' + i.quantity; }).join('<br>');
        const colIndex = COLUMNS.findIndex(function (c) { return c.key === col.key; });
        const prevCol = COLUMNS[colIndex - 1];
        const nextCol = COLUMNS[colIndex + 1];
        card.innerHTML =
          '<div class="ocode">P-' + String(o.id).padStart(4, '0') + '</div>' +
          '<div class="oname">' + escapeHtml_(o.customerName) + '</div>' +
          '<div class="ophone"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" style="vertical-align:-1px;display:inline-block;"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a2 2 0 01-2 2C10 19 5 14 3 8a2 2 0 012-2 2 2 0 011-3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg> ' + escapeHtml_(o.phone) + '</div>' +
          (itemsText ? '<div class="oitems">' + itemsText + '</div>' : '') +
          '<div class="oprice">' + Number(o.total).toLocaleString() + ' د.ع</div>' +
          '<div class="quick-move-row">' +
          (prevCol ? '<button class="quick-move-btn" onclick="event.stopPropagation();quickMove(' + o.id + ',\'' + prevCol.key + '\')">◀ ' + prevCol.label.replace(/^[^\s]+\s/, '') + '</button>' : '<span></span>') +
          (nextCol ? '<button class="quick-move-btn" onclick="event.stopPropagation();quickMove(' + o.id + ',\'' + nextCol.key + '\')">' + nextCol.label.replace(/^[^\s]+\s/, '') + ' ▶</button>' : '<span></span>') +
          '</div>';
        body.appendChild(card);
        enableCardDrag(card, o.id);
      });
    });
  }

  // ===================== السحب والإفلات (يشتغل بالفأرة واللمس مع بعض) =====================
  let dragState = null;
  let justDragged = false;

  function enableCardDrag(card, orderId) {
    card.addEventListener('pointerdown', function (evt) {
      // نتجاهل الضغط على الأزرار الصغيرة داخل البطاقة (النقل السريع)
      if (evt.target.closest('.quick-move-btn')) return;

      const rect = card.getBoundingClientRect();
      dragState = {
        orderId: orderId,
        card: card,
        startX: evt.clientX,
        startY: evt.clientY,
        offsetX: evt.clientX - rect.left,
        offsetY: evt.clientY - rect.top,
        width: rect.width,
        moved: false,
      };
    });
  }

  window.addEventListener('pointermove', function (evt) {
    if (!dragState) return;
    const dx = Math.abs(evt.clientX - dragState.startX);
    const dy = Math.abs(evt.clientY - dragState.startY);

    // نبدأ السحب الفعلي بس لو تحرّك الإصبع/الفأرة مسافة حقيقية (يمنع تعارضه مع نقرة عادية)
    if (!dragState.moved && (dx > 8 || dy > 8)) {
      dragState.moved = true;
      dragState.card.classList.add('dragging');
      dragState.card.style.position = 'fixed';
      dragState.card.style.width = dragState.width + 'px';
      dragState.card.style.zIndex = '50';
      dragState.card.style.pointerEvents = 'none';
    }
    if (!dragState.moved) return;

    dragState.card.style.left = (evt.clientX - dragState.offsetX) + 'px';
    dragState.card.style.top = (evt.clientY - dragState.offsetY) + 'px';

    document.querySelectorAll('.col').forEach(function (c) { c.classList.remove('drop-target'); });
    const under = document.elementFromPoint(evt.clientX, evt.clientY);
    const col = under && under.closest('.col');
    if (col) col.classList.add('drop-target');
  });

  window.addEventListener('pointerup', function (evt) {
    if (!dragState) return;
    const wasMoved = dragState.moved;
    const orderId = dragState.orderId;
    const card = dragState.card;

    if (wasMoved) {
      card.classList.remove('dragging');
      card.style.position = '';
      card.style.left = '';
      card.style.top = '';
      card.style.width = '';
      card.style.zIndex = '';
      card.style.pointerEvents = '';

      document.querySelectorAll('.col').forEach(function (c) { c.classList.remove('drop-target'); });
      const under = document.elementFromPoint(evt.clientX, evt.clientY);
      const col = under && under.closest('.col');
      if (col) {
        const newStatus = col.getAttribute('data-status-key');
        const order = orders.find(function (o) { return o.id === orderId; });
        if (order && order.status !== newStatus) {
          quickMove(orderId, newStatus);
        } else {
          renderBoard(); // نرجّعها بمكانها لو أفلتها بنفس العمود
        }
      } else {
        renderBoard();
      }
      justDragged = true;
      setTimeout(function () { justDragged = false; }, 50);
    }
    dragState = null;
  });

  function openDetail(orderId) {
    const o = orders.find(function (x) { return x.id === orderId; });
    if (!o) return;
    const modal = document.getElementById('detailModal');
    const itemsHtml = (o.items || []).map(function (i) {
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;">' +
        '<span>' + escapeHtml_(i.productName) + '</span><span style="font-weight:700;">× ' + i.quantity + '</span></div>';
    }).join('');

    modal.innerHTML =
      '<button class="modal-close" onclick="closeDetail()"><svg viewBox="0 0 24 24" fill="none" width="14" height="14" style="vertical-align:-2px;display:inline-block;"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
      '<div style="clear:both;"></div>' +
      '<h2 style="font-size:16px;font-weight:800;margin-top:10px;">P-' + String(o.id).padStart(4, '0') + '</h2>' +
      '<p style="font-size:13px;color:var(--text-dim);margin-top:4px;">' + o.status + '</p>' +
      '<div style="background:var(--bg);border-radius:12px;padding:12px;margin-top:14px;font-size:12.5px;line-height:1.9;">' +
      '<b>' + escapeHtml_(o.customerName) + '</b><br><svg width="10" height="10" viewBox="0 0 24 24" fill="none" style="vertical-align:-1px;display:inline-block;"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a2 2 0 01-2 2C10 19 5 14 3 8a2 2 0 012-2 2 2 0 011-3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg> ' + escapeHtml_(o.phone) +

  function quickMove(orderId, newStatus) {
    fetch(API_URL + '/update-order-status', {
      method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ orderId: orderId, status: newStatus }),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.result === 'success') { loadOrders(); }
        else { alert('تعذر نقل الطلب: ' + (data.error || 'خطأ غير معروف')); }
      })
      .catch(function () { alert('تعذر الاتصال بالخادم — تأكد من الإنترنت.'); });
  }

  function saveStatus(orderId) {
    const newStatus = document.getElementById('statusSelect').value;
    const btn = event.target;
    const originalText = btn.textContent;
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';

    fetch(API_URL + '/update-order-status', {
      method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ orderId: orderId, status: newStatus }),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.result === 'success') {
          closeDetail();
          loadOrders();
        } else {
          btn.disabled = false; btn.textContent = originalText;
          alert('تعذر حفظ الحالة: ' + (data.error || 'خطأ غير معروف') + '\nجرّب مرة ثانية.');
        }
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = originalText;
        alert('تعذر الاتصال بالخادم — تأكد من الإنترنت وحاول مرة ثانية.');
      });
  }

  const STOREFRONT_URL = 'https://mustafamohussain-tech.github.io/pipely-storefront/';

  function buildInvoiceHtml(order) {
    const code = 'P-' + String(order.id).padStart(4, '0');
    const dateStr = new Date().toLocaleDateString('ar-IQ');
    const itemsRows = (order.items || []).map(function (i) {
      return '<tr><td>' + escapeHtml_(i.sku || '-') + '</td><td>' + escapeHtml_(i.productName) + '</td><td>' + i.quantity + '</td></tr>';
    }).join('');
    return '' +
      '<div class="inv-header"><div id="invoiceQr" style="position:absolute;top:0;right:0;width:56px;height:56px;"></div>' +
      '<div class="inv-brand">Pipely</div><div class="inv-title">فاتورة شراء</div></div>' +
      '<div class="inv-meta"><span>رقم الطلب: ' + code + '</span><span>التاريخ: ' + dateStr + '</span></div>' +
      '<div class="inv-block"><b>' + escapeHtml_(order.customerName) + '</b><br>Tel: ' + escapeHtml_(order.phone) +
      (order.address ? '<br>العنوان: ' + escapeHtml_(order.address) : '') + '</div>' +
      '<table class="inv-table"><thead><tr><th>الكود</th><th>المنتج</th><th>الكمية</th></tr></thead>' +
      '<tbody>' + itemsRows + '</tbody></table>' +
      '<div class="inv-total"><span>المجموع</span><span>' + Number(order.total).toLocaleString() + ' د.ع</span></div>' +
      '<div style="margin-top:10px;font-size:10.5px;color:var(--text-mute);text-align:center;">طريقة الدفع: الدفع عند الاستلام</div>';

  let currentInvoiceOrder = null;

  function printInvoice(orderId) {
    const o = orders.find(function (x) { return x.id === orderId; });

    currentInvoiceOrder = o;
    document.getElementById('invoiceTemplate').innerHTML = buildInvoiceHtml(o);

      new QRCode(document.getElementById('invoiceQr'), { text: trackUrl, width: 56, height: 56, colorDark: '#241f38' });

  let __analyticsData = null;
  let __analyticsPeriod = 'today';
  const __analyticsPeriodLabels = { today: 'اليوم', week: 'آخر أسبوع', month: 'آخر شهر' };
  const __analyticsStatKeyByPeriod = { today: 'today', week: 'week', month: 'month' };

  function openAnalytics() {
    const overlay = document.getElementById('analyticsOverlay');
    const box = document.getElementById('analyticsResult');
    overlay.classList.add('open');
    __analyticsPeriod = 'today';
    ['today', 'week', 'month'].forEach(function (p) {
      document.getElementById('apTab' + p.charAt(0).toUpperCase() + p.slice(1)).classList.toggle('on', p === 'today');
    });
    box.innerHTML = '<p style="text-align:center;color:var(--text-mute);font-size:12px;">جارٍ التحميل...</p>';

    fetch(API_URL + '/analytics', { headers: authHeaders() })
      .then(function (res) {
        if (res.status === 401) { staffLogout(); throw new Error('session-expired'); }
        return res.json();
      })
      .then(function (data) {
        if (data.result !== 'success') {
          box.innerHTML = '<p style="text-align:center;color:var(--danger);font-size:12px;">تعذّر تحميل التحليلات: ' + (data.error || '') + '</p>';
          return;
        }
        __analyticsData = data;
        renderAnalytics();
      })
      .catch(function () {
        box.innerHTML = '<p style="text-align:center;color:var(--danger);font-size:12px;">تعذر الاتصال بالخادم</p>';
      });
  }

  function closeAnalytics() {
    document.getElementById('analyticsOverlay').classList.remove('open');
  }

  function switchAnalyticsPeriod(period) {
    __analyticsPeriod = period;
    ['today', 'week', 'month'].forEach(function (p) {
      document.getElementById('apTab' + p.charAt(0).toUpperCase() + p.slice(1)).classList.toggle('on', p === period);
    });
    renderAnalytics();
  }

  function renderAnalytics() {
    if (!__analyticsData) return;
    const d = __analyticsData;
    const p = __analyticsPeriod;
    const box = document.getElementById('analyticsResult');
    const sales = d.sales[p] || { count: 0, revenue: 0, avgOrderValue: 0 };

    let html = '<div class="an-stat-grid">' +
      '<div class="an-stat-card"><div class="an-stat-num">' + sales.count + '</div><div class="an-stat-lbl">عدد الطلبات</div></div>' +
      '<div class="an-stat-card"><div class="an-stat-num">' + sales.revenue.toLocaleString() + '</div><div class="an-stat-lbl">إجمالي المبيعات</div></div>' +
      '<div class="an-stat-card"><div class="an-stat-num">' + sales.avgOrderValue.toLocaleString() + '</div><div class="an-stat-lbl">متوسط الطلب</div></div>' +
      '</div>';

    // أفضل المنتجات مبيعًا
    const topProducts = (d.topProducts && d.topProducts[p]) || [];
    html += '<div class="an-section-title">أفضل المنتجات مبيعًا (' + __analyticsPeriodLabels[p] + ')</div>';
    if (topProducts.length === 0) {
      html += '<p style="font-size:11.5px;color:var(--text-mute);">ماكو مبيعات بهذي الفترة</p>';
    } else {
      topProducts.forEach(function (row) {
        html += '<div class="an-row"><span>' + row.name + '</span><span class="an-row-val">' + row.quantity + '</span></div>';
      });
    }

    // أكثر المنتجات مشاهدة (لو التتبّع مفعّل)
    if (d.viewsTrackingActive) {
      const topViewed = (d.topViewed && d.topViewed[p]) || [];
      html += '<div class="an-section-title">أكثر المنتجات مشاهدة (' + __analyticsPeriodLabels[p] + ')</div>';
      if (topViewed.length === 0) {
        html += '<p style="font-size:11.5px;color:var(--text-mute);">ماكو مشاهدات مسجّلة بهذي الفترة</p>';
      } else {
        topViewed.forEach(function (row) {
          html += '<div class="an-row"><span>' + row.name + '</span><span class="an-row-val">' + row.views + '</span></div>';
        });
      }
    }

    // توزيع المناطق
    const regions = (d.regionBreakdown && d.regionBreakdown[p]) || {};
    const regionKeys = Object.keys(regions).sort(function (a, b) { return regions[b] - regions[a]; });
    html += '<div class="an-section-title">أكثر المناطق طلبًا (' + __analyticsPeriodLabels[p] + ')</div>';
    if (regionKeys.length === 0) {
      html += '<p style="font-size:11.5px;color:var(--text-mute);">ماكو بيانات بهذي الفترة</p>';
    } else {
      regionKeys.forEach(function (region) {
        html += '<div class="an-row"><span>' + region + '</span><span class="an-row-val">' + regions[region] + '</span></div>';
      });
    }

    // توزيع حالات الطلبات (إجمالي، مو مقسّم بالفترة)
    html += '<div class="an-section-title">توزيع حالات الطلبات (الإجمالي)</div>';
    Object.keys(d.statusBreakdown || {}).forEach(function (status) {
      html += '<div class="an-row"><span>' + status + '</span><span class="an-row-val">' + d.statusBreakdown[status] + '</span></div>';
    });

    // أداء الموظفين (إجمالي)
    html += '<div class="an-section-title">أداء الموظفين — عدد الطلبات المُعالَجة (الإجمالي)</div>';
    if (!d.staffPerformance || d.staffPerformance.length === 0) {
      html += '<p style="font-size:11.5px;color:var(--text-mute);">ماكو بيانات بعد</p>';
    } else {
      d.staffPerformance.forEach(function (row) {
        html += '<div class="an-row"><span>' + row.staff + '</span><span class="an-row-val">' + row.ordersHandled + '</span></div>';
      });
    }

    if (!d.viewsTrackingActive) {
      html += '<p style="font-size:10.5px;color:var(--text-mute);margin-top:14px;text-align:center;"><svg viewBox="0 0 24 24" fill="none" width="12" height="12" style="vertical-align:-1px;display:inline-block;"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> تتبّع مشاهدات المنتجات غير مفعّل بعد — يحتاج إعداد إضافي بسيط</p>';
    }

    box.innerHTML = html;
  }

  function downloadInvoicePdf() {
    if (!currentInvoiceOrder) return;
    const tpl = document.getElementById('invoiceTemplate');
    html2pdf().from(tpl).set({
      filename: 'فاتورة-' + 'P-' + String(currentInvoiceOrder.id).padStart(4, '0') + '.pdf',
      margin: 8,
      html2canvas: { scale: 2 },
    }).save();
  }

  function loadInventory() {
    const wrap = document.getElementById('invWrap');
    wrap.innerHTML = '<p style="text-align:center;color:var(--text-mute);font-size:12px;">جارٍ التحميل...</p>';
    fetch(API_URL + '/inventory', { headers: authHeaders() })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.result !== 'success') { wrap.innerHTML = '<p>تعذر تحميل المخزون</p>'; return; }
        wrap.innerHTML = '';
        (data.products || []).forEach(function (p) {
          const card = document.createElement('div');
          card.className = 'inv-card';
          card.innerHTML =
            '<div class="inv-info"><div class="inv-name">' + escapeHtml_(p.name) + '</div>' +
            '<div class="inv-sku">' + (p.sku || 'بدون كود') + '</div>' +
            '<div class="inv-stock">' + p.stock + ' قطعة</div></div>' +
            '<div class="inv-actions">' +
            '<button class="inv-btn add" onclick="addStockPrompt(' + p.id + ',\'' + p.name.replace(/'/g, "") + '\')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="vertical-align:-1px;margin-left:4px;"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>إدخال مخزون</button>' +
            '<button class="inv-btn set" onclick="setStockPrompt(' + p.id + ',' + p.stock + ')">تعديل يدوي</button>' +
            '<button class="inv-btn set" onclick="openProductForm(' + p.id + ')">تعديل المنتج</button>' +
            '</div>';
          wrap.appendChild(card);
        });
      })
      .catch(function () { wrap.innerHTML = '<p>تعذر الاتصال بالخادم</p>'; });
  }

  function addStockPrompt(productId, productName) {
    const qty = prompt('كم قطعة وصلت من "' + productName + '"؟');
    const n = parseInt(qty, 10);
    if (!n || n <= 0) return;
    fetch(API_URL + '/add-stock', {
      method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ productId: productId, quantity: n }),
    })
      .then(function (res) { return res.json(); })
      .then(function () { loadInventory(); });
  }

  function setStockPrompt(productId, currentStock) {
    const qty = prompt('عدّل الكمية الحالية إلى:', currentStock);
    if (qty === null) return;
    const n = parseInt(qty, 10);
    if (isNaN(n) || n < 0) return;
    fetch(API_URL + '/set-stock', {
      method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ productId: productId, quantity: n }),
    })
      .then(function (res) { return res.json(); })
      .then(function () { loadInventory(); });
  }

  // ===================== بحث الزبائن =====================
  let __currentNotesPhone = '';
  function searchCustomer() {
    const q = document.getElementById('custSearchInput').value.trim();
    const box = document.getElementById('custResult');
    if (!q) return;
    box.innerHTML = '<p style="text-align:center;color:var(--text-mute);font-size:12px;margin-top:12px;">جارٍ البحث...</p>';
    fetch(API_URL + '/customer-lookup?query=' + encodeURIComponent(q), { headers: authHeaders() })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.result !== 'success') { box.innerHTML = '<p style="text-align:center;color:var(--danger);font-size:12px;margin-top:12px;">' + (data.error || 'ماكو زبون بهذا الرقم') + '</p>'; return; }
        const c = data.customer;
        __currentNotesPhone = c.phone;
        const ordersHtml = (data.orders || []).map(function (o) {
          const itemsText = (o.items || []).map(function (i) { return escapeHtml_(i.productName) + ' ×' + i.quantity; }).join('، ');
          return '<div class="cust-order-row"><div><b>' + o.code + '</b><br><span style="color:var(--text-mute);font-size:10.5px;">' + (itemsText || 'ماكو تفاصيل') + '</span></div>' +
            '<div style="text-align:left;"><div>' + Number(o.total).toLocaleString() + ' د.ع</div><span style="font-size:10px;color:var(--text-mute);">' + o.status.replace(/^\S+\s/, '') + '</span></div></div>';
        }).join('') || '<p style="color:var(--text-mute);font-size:12px;">ماكو طلبات سابقة</p>';

        box.innerHTML = '<div class="cust-info-card">' +
          '<div style="font-size:15px;font-weight:800;">' + escapeHtml_(c.name) + '</div>' +
          '<div style="font-size:12px;color:var(--text-dim);margin-top:2px;">' + escapeHtml_(c.phone) + ' — رقم الزبون: ' + escapeHtml_(c.code) + '</div>' +
          '<div style="margin-top:12px;">' + ordersHtml + '</div>' +
          '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px;">' +
          '<div style="font-size:13px;font-weight:800;margin-bottom:8px;">ملاحظات على الزبون</div>' +
          '<div id="custNotesList" style="margin-bottom:10px;"><p style="color:var(--text-mute);font-size:11.5px;">جارٍ التحميل...</p></div>' +
          '<textarea id="newNoteText" rows="2" placeholder="اكتب ملاحظة جديدة..." style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:12px;margin-bottom:8px;"></textarea>' +
          '<button class="submit-btn" style="padding:9px;font-size:12px;" onclick="addCustomerNote()">إضافة ملاحظة</button>' +
          '</div></div>';
        loadCustomerNotes();
      })
      .catch(function () { box.innerHTML = '<p style="text-align:center;color:var(--danger);font-size:12px;">تعذر الاتصال بالخادم</p>'; });
  }

  function loadCustomerNotes() {
    const list = document.getElementById('custNotesList');
    if (!list || !__currentNotesPhone) return;
    fetch(API_URL + '/customer-notes?phone=' + encodeURIComponent(__currentNotesPhone), { headers: authHeaders() })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.result !== 'success' || !data.notes || data.notes.length === 0) {
          list.innerHTML = '<p style="color:var(--text-mute);font-size:11.5px;">ماكو ملاحظات بعد</p>';
          return;
        }
        list.innerHTML = data.notes.map(function (n) {
          const when = n.createdAt ? new Date(n.createdAt).toLocaleString('ar-IQ') : '';
          return '<div style="background:var(--bg);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:11.5px;">' +
            '<div>' + escapeHtml_(n.note) + '</div>' +
            '<div style="color:var(--text-mute);font-size:10px;margin-top:3px;">' + escapeHtml_(n.staffUsername) + ' — ' + when + '</div></div>';
        }).join('');
      })
      .catch(function () { list.innerHTML = '<p style="color:var(--danger);font-size:11.5px;">تعذر تحميل الملاحظات</p>'; });
  }

  function addCustomerNote() {
    const textEl = document.getElementById('newNoteText');
    const note = textEl.value.trim();
    if (!note || !__currentNotesPhone) return;
    fetch(API_URL + '/add-customer-note', {
      method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ phone: __currentNotesPhone, note: note }),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.result === 'success') {
          textEl.value = '';
          loadCustomerNotes();
        } else {
          alert(data.error || 'تعذّرت إضافة الملاحظة');
        }
      })
      .catch(function () { alert('تعذر الاتصال بالخادم'); });
  }

      document.getElementById('pfCategory').value = '';
      document.getElementById('pfSku').value = '';
      document.getElementById('pfStock').value = '';
      document.getElementById('pfStockLabel').style.display = 'block';
      document.getElementById('pfStock').style.display = 'block';
      document.getElementById('productFormOverlay').classList.add('open');
      return;
    }

    document.getElementById('productFormTitle').textContent = 'تعديل المنتج';
    document.getElementById('pfStockLabel').style.display = 'none';
    document.getElementById('pfStock').style.display = 'none';
    document.getElementById('productFormOverlay').classList.add('open');

    fetch(API_URL + '/products')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        const p = (data.products || []).find(function (x) { return x.id === productId; });
        if (!p) return;
        document.getElementById('pfName').value = p.name || '';
        document.getElementById('pfPrice').value = p.price || '';
        document.getElementById('pfDescription').value = p.description || '';
        document.getElementById('pfCategory').value = p.category || '';
        document.getElementById('pfSku').value = p.sku || '';
        productFormImages = p.images || (p.image ? [{ url: p.image }] : []);
        renderProductImagesPreview();
      });
  }

  function closeProductForm() {
    document.getElementById('productFormOverlay').classList.remove('open');
  }

  function renderProductImagesPreview() {
    const box = document.getElementById('pfImagesPreview');
    box.innerHTML = productFormImages.map(function (img) {
      return '<img src="' + (img.url || img.signedUrl || '') + '">';
    }).join('');
  }

  function onProductImagesSelected(evt) {
    const files = Array.from(evt.target.files || []);
    if (files.length === 0) return;
    const btn = document.querySelector('.pf-upload-btn');
    btn.disabled = true; btn.textContent = 'جارٍ الرفع...';

    const uploads = files.map(function (file) {
      const form = new FormData();
      form.append('file', file, file.name);
      return fetch(API_URL + '/upload-product-image', { method: 'POST', headers: authHeaders(), body: form }).then(function (res) { return res.json(); });
    });

    Promise.all(uploads).then(function (results) {
      results.forEach(function (r) { if (r.result === 'success' && r.file) productFormImages.push(r.file); });
      renderProductImagesPreview();
      btn.disabled = false; btn.textContent = '+ رفع صورة';
    });
  }

  function saveProductForm() {
    const name = document.getElementById('pfName').value.trim();
    const price = document.getElementById('pfPrice').value;
    const msg = document.getElementById('pfMsg');
    const btn = document.getElementById('pfSaveBtn');

    if (!name || !price) {
      msg.className = 'msg error'; msg.textContent = 'اسم المنتج والسعر إلزاميين'; msg.style.display = 'block';
      return;
    }

    const payload = {
      name: name,
      price: price,
      description: document.getElementById('pfDescription').value.trim(),
      category: document.getElementById('pfCategory').value.trim(),
      sku: document.getElementById('pfSku').value.trim(),
      images: productFormImages,
    };
    if (!editingProductId) payload.stock = document.getElementById('pfStock').value || 0;
    else payload.productId = editingProductId;

    const endpoint = editingProductId ? '/update-product' : '/add-product';
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';

    fetch(API_URL + endpoint, {
      method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify(payload),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        btn.disabled = false; btn.textContent = 'حفظ المنتج';
        if (data.result === 'success') {
          closeProductForm();
          loadInventory();
        } else {
          msg.className = 'msg error'; msg.textContent = data.error || 'حدث خطأ، حاول مرة ثانية'; msg.style.display = 'block';
        }
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'حفظ المنتج';
        msg.className = 'msg error'; msg.textContent = 'تعذر الاتصال بالخادم'; msg.style.display = 'block';
      });
  }

  (function init() {
    if (getStaffSession()) enterApp();
  })();
</script>
</body>
</html>
